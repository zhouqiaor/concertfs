    ErrorBody:
      type: object
      required: [code, message, trace_id, retriable]
      properties:
        code:
          type: string
          description: |
            HTTP 错误机器码（冻结 enum）。客户端合成码（OFFLINE / PAIR_SAS_MISMATCH /
            FINGERPRINT_CHANGED / LOCAL_DISK_FULL / SENDTO_NO_RW_DEVICE /
            STAGING_QUOTA_EXCEEDED）不产生 HTTP 响应，不在本 enum 中。
            ANOTHER_SESSION 为 ADR-18 前的 deprecated 别名，保留一个版本。
          enum:
            - INVALID_ARGUMENT
            - BAD_CURSOR
            - INVALID_NAME
            - PROTOCOL_VERSION
            - INVALID_MANIFEST
            - TOKEN_INVALID
            - TOKEN_EXPIRED
            - PAIR_REQUIRED
            - REVOKED
            - DEVICE_MISMATCH
            - SCOPE_DENIED
            - PAIRING_CLOSED
            - USER_DENIED
            - PAIR_MAC_INVALID
            - BIND_REFUSED
            - NOT_FOUND
            - SESSION_NOT_FOUND
            - NO_THUMB
            - OFFER_NOT_FOUND
            - BATCH_NOT_FOUND
            - METHOD_NOT_ALLOWED
            - REQUEST_TIMEOUT
            - ALREADY_EXISTS
            - NOT_EMPTY
            - UPLOAD_INCOMPLETE
            - PARTIAL
            - OFFER_EXPIRED
            - BATCH_CANCELED
            - FILE_CHANGED
            - REVISION_TOO_OLD
            - OFFER_GONE
            - PRECONDITION_FAILED
            - TOO_LARGE
            - UNSUPPORTED_MEDIA
            - RANGE_NOT_SATISFIABLE
            - CHECKSUM_MISMATCH
            - WRITER_BUSY
            - RATE_LIMITED
            - INTERNAL
            - NOT_SUPPORTED
            - UNAVAILABLE
            - ANOTHER_SESSION
            - FLEET_FULL
            - NOT_READY
            - INSUFFICIENT_STORAGE
          x-phonefs-deprecated-codes:
            ANOTHER_SESSION:
              deprecated: true
              description: ADR-14 单活跃 consumer 时代别名；ADR-18 起由 FLEET_FULL 取代，保留一个版本。
        message:
          type: string
          description: 人类可读英文短串，不面向终端用户。
        trace_id:
          type: string
        retriable:
          type: boolean
        details:
          type: object
          additionalProperties: true
          description: |
            可选结构化细节。已知键（非 required，按错误码出现）：
            received / required / expected / actual / deleted / failed / reason /
            hint / latest_full / size / retry_after / active / max / fid / free /
            plan。客户端必须容忍未知键。

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
